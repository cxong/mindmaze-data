<html>
    <head>
        <script>
            // Load MINDMAZE.DB
            let questions = [];
            fetch("MINDMAZE.DB")
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    const view = new DataView(buffer);
                    /**
                     * MINDMAZE data structure:
                     * uint32_t delimiter; // -1
                     * uint32_t question_len;
                     * string question;
                     * byte answer1Len;
                     * string answer1;
                     * uint32_t unknown1;
                     * byte answer2Len;
                     * string answer2;
                     * uint32_t unknown2;
                     * byte answer3Len;
                     * string answer3;
                     * uint32_t unknown3;
                     * byte answer4Len;
                     * string answer4;
                     * uint32_t unknown4;
                     * Sometimes there's extra unknown data at the end
                     */
                    let offset = 0;
                    while (true) {
                        // Try to find the delimiter
                        while (offset < view.byteLength) {
                            const value = view.getUint32(offset, true);
                            if (value === 0xFFFFFFFF) {
                                break;
                            }
                            offset += 1;
                        }
                        // Skip the delimiter
                        offset += 4;
                        const questionLen = view.getUint32(offset, true);
                        offset += 4;
                        // Read question - keep reading until we get an unprintable character
                        const question = new TextDecoder().decode(new Uint8Array(view.buffer.slice(offset, offset + questionLen)));
                        offset += questionLen;
                        console.log(`Loaded question: ${question}`);
                        // Read answers
                        const answers = [];
                        for (let i = 0; i < 4; i++) {
                            const answerLen = view.getUint8(offset);
                            offset++;
                            let answer = new TextDecoder("ISO-8859-2").decode(new Uint8Array(view.buffer.slice(offset, offset + answerLen)));
                            // Sometimes answers are null terminated so take the slice until the first null character
                            const nullIndex = answer.indexOf("\0");
                            if (nullIndex !== -1) {
                                answer = answer.slice(0, nullIndex);
                            }
                            offset += answerLen;
                            // Strip and convert XML tags in answers
                            answer = answer.replace(/<it>/g, "<i>").replace(/<\/it>/g, "</i>");
                            const answerText = answer.replace(/<[^>]+>/g, "").trim();
                            const b1 = view.getUint8(offset);
                            offset++;
                            const b2 = view.getUint8(offset);
                            offset++;
                            const b3 = view.getUint8(offset);
                            offset++;
                            const b4 = view.getUint8(offset);
                            offset++;
                            console.log(`- Loaded answer ${i + 1}: ${answer} ${answerText} ${b1} ${b2} ${b3} ${b4}`);
                            answers.push({ answer, answerText, b1, b2, b3, b4 });
                        }
                        questions.push({ question, answers });
                        if (offset >= view.byteLength) {
                            break;
                        }
                    }

                    // Display questions
                    const questionsDiv = document.getElementById("questions");
                    questions.forEach((q, index) => {
                        const questionElement = document.createElement("div");
                        questionElement.innerHTML = `<h2>Question ${index + 1}: ${q.question}</h2>`;
                        q.answers.forEach((a, i) => {
                            const answerElement = document.createElement("p");
                            answerElement.innerHTML = `Answer ${i + 1}: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(a.answerText)}" target="_blank">${a.answer}</a> ${a.b1} ${a.b2} ${a.b3} ${a.b4}`;
                            questionElement.appendChild(answerElement);
                        });
                        questionsDiv.appendChild(questionElement);
                    });
                })
                .catch(error => {
                    console.error("Error loading MINDMAZE.DB:", error);
                });

        </script>
    </head>
    <body>
        <h1>MINDMAZE Questions</h1>
        <div id="questions"></div>
    </body>
</html>
